name: Update CSGORoll Leaderboard

on:
  schedule:
    # Every 15 minutes. Unlike the Kicks workflow this does NOT need a sub-15-min cadence
    # or the self-dispatch relay - CSGORoll wagered totals move slowly, and the page also
    # does a best-effort live fetch on top of this snapshot, so 15 min of lag on the
    # committed file is invisible in practice. 15 min is also the shortest interval GitHub
    # runs `schedule` at without heavy throttling.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# A manual run and a scheduled run must not race on `git push`.
concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies - scripts/update-leaderboard.js uses Node's built-in global fetch
      # to call nickpf.com directly (server-side, no CORS, no proxy).
      - name: Fetch CSGORoll leaderboard snapshot
        run: node scripts/update-leaderboard.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/leaderboard.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update CSGORoll leaderboard snapshot"
          # The Kicks leaderboard workflow (and manual commits) can push to main between
          # our checkout and our push, so `git push` races and gets rejected. Rebase our
          # single snapshot commit onto the latest remote and retry a few times.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing on latest main..."
            git pull --rebase --autostash origin main
          done
          echo "Failed to push after 5 attempts"
          exit 1
