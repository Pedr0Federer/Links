name: Update Kicks Leaderboard

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kicks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Kicks leaderboard snapshot
        run: node scripts/update-kicks.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/kicks.json
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Auto-update Kicks leaderboard snapshot" && git push)
