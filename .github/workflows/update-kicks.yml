name: Update Kicks Leaderboard

on:
  schedule:
    # GitHub is documented to throttle/delay `schedule` events under load - it does not
    # guarantee this exact cadence, especially below ~15min (low-priority queue, can be
    # skipped/batched). This is the closest to "every 5-10 min" GitHub's scheduler will
    # realistically honor without runs getting silently dropped.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kicks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer dependencies
        run: npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: Fetch Kicks leaderboard snapshot
        run: node scripts/update-kicks.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/kicks.json
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Auto-update Kicks leaderboard snapshot" && git push)
